apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollout-sa
  namespace: anti-spam
---
apiVersion: v1
kind: Secret
metadata:
  name: rollout-sa-token
  namespace: anti-spam
  annotations:
    kubernetes.io/service-account.name: rollout-sa
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollout-restart-role
  namespace: anti-spam
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["anti-spam"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollout-restart-binding
  namespace: anti-spam
subjects:
  - kind: ServiceAccount
    name: rollout-sa
    namespace: anti-spam
roleRef:
  kind: Role
  name: rollout-restart-role
  apiGroup: rbac.authorization.k8s.io
